name: ci-br

# lint: statix, deadnix, nixfmt (tools from the nixpkgs pinned in flake.lock).
# check: `nix flake check` on x86_64-linux; builds everything, including the
#   Rust engine (fat LTO, several minutes) and runs the checks in nix/checks.nix.
# eval-all-systems: evaluation only (no build) of every system the flake
#   declares. Cheap, and catches aarch64/darwin evaluation errors without a
#   native arm runner; a native aarch64 build would only repeat the long engine
#   build for no extra signal on the packaging itself.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (statix, deadnix, nixfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: statix
        run: nix shell --inputs-from . nixpkgs#statix -c statix check .
      - name: deadnix
        run: nix shell --inputs-from . nixpkgs#deadnix -c deadnix --fail .
      - name: nixfmt
        run: nix shell --inputs-from . nixpkgs#nixfmt nixpkgs#findutils -c sh -c 'find . -name "*.nix" -not -path "./.git/*" -print0 | xargs -0 nixfmt --check'

  check:
    name: nix flake check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: nix flake check
        run: nix flake check --print-build-logs --keep-going

  eval-all-systems:
    name: evaluate all systems (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: nix flake check --no-build --all-systems
        run: nix flake check --no-build --all-systems
